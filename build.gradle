plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
    // Optional integrations are compiled against the published jars on Modrinth's Maven.
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
        testWorld {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // EMI is the only required mod at runtime. Create and YACL integrations are optional; Simulated is reached
    // through reflection (it only ships inside the Create Aeronautics bundle), so nothing needs to be in libs/.
    compileOnly 'maven.modrinth:emi:1.1.24+1.21.1+neoforge'
    compileOnly('maven.modrinth:create:6.0.10+mc1.21.1') { transitive = false }
    compileOnly('maven.modrinth:yacl:3.8.2+1.21.1-neoforge') { transitive = false }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            emi_version_range      : emi_version_range,
            simulated_version_range: simulated_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
