plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.INFO
        }
        testWorld {
            client()
            gameDirectory = project.file('run')
            programArguments.addAll '--quickPlaySingleplayer', 'New World'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // EMI is the only required mod. Simulated is optional (section banner import only).
    compileOnly files('libs/emi-1.1.24+1.21.1+neoforge.jar')
    compileOnly files('libs/simulated-neoforge-1.21.1-1.3.2.jar')
    compileOnly files('libs/veil-neoforge-1.21.1-4.3.2.jar')
    compileOnly files('libs/create-1.21.1-6.0.10.jar')
    compileOnly files('libs/Registrate-MC1.21-1.3.0+67.jar')
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
            emi_version_range      : emi_version_range,
            simulated_version_range: simulated_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
